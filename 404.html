<!DOCTYPE html>
<html lang="bg" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Страницата не е намерена — Кетъринг Фирдаус</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000;--accent:#2fb469;--accent-bright:#45c47f;--accent-deep:#1c8f50;
    --on-accent:#06140c;--text-muted:rgba(255,255,255,.62);
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 24% 20%,rgba(47,180,105,.16),transparent 58%),
      linear-gradient(165deg,#101010,#000 68%);
    color:#fff;font-family:var(--font-sans);line-height:1.65;
    -webkit-font-smoothing:antialiased;text-align:center;
    padding:40px max(24px,env(safe-area-inset-left));
  }
  .wrap{max-width:540px}
  img{display:block;height:76px;width:auto;margin:0 auto 34px;border-radius:9px}
  .code{
    display:inline-block;font-size:12px;font-weight:600;letter-spacing:.3em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px;
  }
  h1{
    font-size:clamp(1.75rem,5vw,2.5rem);font-weight:800;letter-spacing:-.03em;
    line-height:1.1;margin:0 0 .5em;
  }
  p{color:var(--text-muted);font-size:15.5px;margin:0 0 32px}
  a.btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:48px;padding:0 30px;border-radius:9999px;
    background:linear-gradient(135deg,var(--accent-bright),var(--accent-deep));
    color:var(--on-accent);text-decoration:none;
    font-size:14px;font-weight:600;letter-spacing:.02em;
    transition:transform .3s var(--ease),box-shadow .3s var(--ease);
  }
  a.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(47,180,105,.5)}
  .tel{display:block;margin-top:26px;font-size:14px;color:var(--text-muted);text-decoration:none}
  .tel strong{color:#fff}
  .tel:hover strong{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/img/logo.png" alt="Кетъринг Фирдаус"
         onerror="this.style.display='none'">
    <span class="code">404</span>
    <h1>Страницата не е намерена</h1>
    <p>Съжаляваме — страницата, която търсите, не съществува или е преместена.</p>
    <a class="btn" href="/">Към началната страница</a>
    <a class="tel" href="tel:0879333926">Или се обадете за поръчка: <strong>0879 333 926</strong></a>
  </div>
</body>
</html>
